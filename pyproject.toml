[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pulsimgui"
version = "1.1.0"
description = "Cross-platform GUI for Pulsim power electronics simulator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Luiz Gili", email = "luizcarlosgili@gmail.com" }
]
keywords = ["power electronics", "circuit simulation", "GUI", "Qt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "PySide6>=6.5.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.24.0",
    "qtawesome>=1.3.0",
    # >=1.6.5 — the motor-drive path needs it:
    #   1.6.2 — lazy-import scipy so the native C++ DSED works on the wheel.
    #   1.6.4 — DSED no longer freezes a *plain Python* switch_fn at t=0.
    #   1.6.5 — dynamic-PMSM FOC: closed_loops + switch_fn + step_observer
    #           compose; PWL Newton auto-promotes to LM on multi-stage
    #           switched topologies; PMSM saliency (Ld/Lq); the motor
    #           observer publishes i_d/i_q/ω/θ. Examples 19/20/21 (FOC
    #           compressor drives) + the GUI FOC wiring all require it.
    "pulsim>=1.6.5",
    # scipy is NOT needed for the native C++ DSED engine (the headline
    # ~24× path) — pulsim 1.6.2 reaches that without it. It IS used by
    # the pure-Python BDF2 fallback for the rare circuit the native
    # extractor rejects. Kept as a hard dep (cost is negligible next
    # to PySide6/numpy) so DSED works fully out of the box without a
    # mid-simulation "install scipy" surprise.
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
# Numba JIT for the C_BLOCK "fast block" Python control law. Optional:
# without it, C_BLOCK python_numba mode still runs (pure-Python
# fallback), just not at native speed. Mirrors pulsim's own [fast]
# extra so `pip install pulsimgui[fast]` lights up both layers.
fast = [
    "numba>=0.58",
    "pulsim[fast]>=1.6.5",
]
build = [
    # PyInstaller for creating standalone executables
    "pyinstaller>=6.0.0",
    # Generate multi-resolution Windows ICO from PNG
    "pillow>=10.0.0",
    # macOS DMG creation
    "dmgbuild>=1.6.0;sys_platform=='darwin'",
    # Ensure pulsim backend is available for bundling
    "pulsim>=1.6.5",
]

[project.scripts]
pulsimgui = "pulsimgui.__main__:main"

[project.gui-scripts]
pulsimgui-gui = "pulsimgui.__main__:main"

[project.urls]
Homepage = "https://github.com/lgili/PulsimGui"
Repository = "https://github.com/lgili/PulsimGui"

[tool.hatch.build.targets.wheel]
packages = ["src/pulsimgui"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
qt_api = "pyside6"

[tool.coverage.run]
source = ["src/pulsimgui"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
